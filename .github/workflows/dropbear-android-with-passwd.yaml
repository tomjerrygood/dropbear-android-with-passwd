name: Build Dropbear Android
on:
  push:
    branches: [ '**' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install host build dependencies
        run: |
          set +e
          sudo apt update
          sudo apt install -y --no-upgrade wget tar bzip2 unzip python3 python3-setuptools make patch upx-ucl libtinfo5
          # Ensure libtinfo.so.5 is available in the toolchain sysroot for linking
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/android-arm-toolchain"
          mkdir -p "$TOOLCHAIN_DIR/sysroot/usr/lib"
          sudo cp /usr/lib/x86_64-linux-gnu/libtinfo.so.5 "$TOOLCHAIN_DIR/sysroot/usr/lib/"
          sudo cp /usr/lib/x86_64-linux-gnu/libtinfo.so.5.9 "$TOOLCHAIN_DIR/sysroot/usr/lib/"
      - name: Download Android NDK r17c direct zip
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q android-ndk-r17c-linux-x86_64.zip
      - name: Build standalone toolchain
        run: |
          cd android-ndk-r17c/build/tools
          python3 make_standalone_toolchain.py \
            --arch arm \
            --api 21 \
            --install-dir $GITHUB_WORKSPACE/android-arm-toolchain \
            --force
          # Copy libtinfo5 to toolchain sysroot for cross-compile
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/android-arm-toolchain"
          mkdir -p "$TOOLCHAIN_DIR/sysroot/usr/lib"
          cp /usr/lib/x86_64-linux-gnu/libtinfo.so.5 "$TOOLCHAIN_DIR/sysroot/usr/lib/"
      - name: Compile dropbear with your build.sh
        env:
          TOOLCHAIN: ${{ github.workspace }}/android-arm-toolchain
        run: |
          chmod +x build-dropbear-android.sh
          ./build-dropbear-android.sh
      - name: UPX compress binaries
        run: |
          upx --best target/arm/dropbear
          upx --best target/arm/dropbearkey
          ls -lh target/arm/
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-arm-android
          path: target/arm/
